$font = CaskaydiaCove Nerd Font Mono
$base = rgb(1e1e2e)
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$lavender = rgb(b4befe)
$green = rgb(a6e3a1)
$red = rgb(f38ba8)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = ~/.config/backgrounds/mountain.png
    blur_size = 8
    blur_passes = 3
    brightness = 0.45
    vibrancy = 0.15
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext
    font_size = 22
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $lavender
    inner_color = rgba(1e1e2edd)
    font_color = $text
    check_color = $green
    fail_color = $red
    fade_on_empty = false
    rounding = 14
    font_family = $font
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    fail_text = $PAMFAIL
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $subtext
    font_size = 16
    font_family = $font
    position = 0, -112
    halign = center
    valign = center
}
